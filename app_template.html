<title>補助金コンパス</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --paper: #F7F4EC;
    --paper-raised: #FFFFFF;
    --ink: #211E1A;
    --ink-soft: #5B564C;
    --ai: #1F3E63;
    --ai-soft: #5C82AC;
    --ai-wash: #E7EDF3;
    --gold: #92661F;
    --gold-wash: #F3E8D2;
    --line: #DED6C4;
    --ok: #2E6E43;
    --ok-wash: #E3EFE4;
    --warn: #A6551A;
    --warn-wash: #F5E7D8;
    --mute: #8B8375;
    --mute-wash: #ECE8DD;
    --shadow: 0 8px 24px rgba(33, 30, 26, 0.10), 0 1px 3px rgba(33, 30, 26, 0.08);
    --font-head: "Hiragino Mincho ProN", "YuMincho", "Noto Serif JP", serif;
    --font-body: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, "Noto Sans JP", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181D;
      --paper-raised: #1B2027;
      --ink: #EDEAE1;
      --ink-soft: #B4AEA0;
      --ai: #85A7CE;
      --ai-soft: #4E6F94;
      --ai-wash: #202C38;
      --gold: #D9AE63;
      --gold-wash: #302A1C;
      --line: #2C323B;
      --ok: #7FC28F;
      --ok-wash: #1E2C21;
      --warn: #D08A4C;
      --warn-wash: #33261A;
      --mute: #948C7B;
      --mute-wash: #24282E;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14181D;
    --paper-raised: #1B2027;
    --ink: #EDEAE1;
    --ink-soft: #B4AEA0;
    --ai: #85A7CE;
    --ai-soft: #4E6F94;
    --ai-wash: #202C38;
    --gold: #D9AE63;
    --gold-wash: #302A1C;
    --line: #2C323B;
    --ok: #7FC28F;
    --ok-wash: #1E2C21;
    --warn: #D08A4C;
    --warn-wash: #33261A;
    --mute: #948C7B;
    --mute-wash: #24282E;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ai-wash); }
  a { color: var(--ai); }
  button { font-family: inherit; }
  .tabular { font-variant-numeric: tabular-nums; }

  .app { max-width: 1180px; margin: 0 auto; padding: 0 20px 64px; }

  /* ---- Header ---- */
  .topbar {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .topbar-inner {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand h1 {
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }
  .brand .tagline { color: var(--ink-soft); font-size: 13.5px; }
  .stats { display: flex; gap: 22px; }
  .stat { text-align: right; }
  .stat .num { font-size: 20px; font-weight: 700; color: var(--ai); }
  .stat .label { font-size: 11.5px; color: var(--ink-soft); letter-spacing: 0.04em; }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 4px;
    margin: 4px 0 22px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    appearance: none;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 4px;
    margin-right: 22px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tab-btn[aria-selected="true"] { color: var(--ai); border-bottom-color: var(--ai); }
  .tab-btn:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

  /* ---- Layout: search ---- */
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
  }
  .filters { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.03em; }
  input[type="text"], input[type="search"], select {
    font-family: inherit;
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    width: 100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--ai);
    outline-offset: 1px;
  }
  .amt-row { display: flex; gap: 8px; align-items: center; }
  .amt-row select { flex: 1; }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
  .check-row input { width: 16px; height: 16px; accent-color: var(--ai); }
  .reset-link {
    background: none; border: none; color: var(--ai-soft); font-size: 12.5px;
    cursor: pointer; text-align: left; padding: 0; text-decoration: underline;
  }

  /* ---- Results ---- */
  .results-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .results-count { font-size: 14px; color: var(--ink-soft); }
  .results-count b { color: var(--ink); font-size: 16px; }
  .sort-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
  .sort-row select { width: auto; padding: 6px 8px; font-size: 13px; }

  .card-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover, .card:focus-visible { box-shadow: var(--shadow); border-color: var(--ai-soft); }
  .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .card-title { font-weight: 700; font-size: 15px; line-height: 1.45; text-wrap: balance; }
  .card-org { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .pill {
    flex: none;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  .pill-open { background: var(--ok-wash); color: var(--ok); }
  .pill-soon { background: var(--warn-wash); color: var(--warn); }
  .pill-upcoming { background: var(--ai-wash); color: var(--ai); }
  .pill-closed { background: var(--mute-wash); color: var(--mute); }
  .pill-new { background: var(--ai); color: var(--paper); margin-right: 4px; }
  .overlay-link.secondary { background: none; color: var(--ai); border: 1px solid var(--line); margin-top: 8px; font-size: 13.5px; padding: 10px; }
  .overlay-link.secondary:hover { background: var(--ai-wash); }
  select:disabled { opacity: 0.55; }
  .pill-info { background: var(--gold-wash); color: var(--gold); }
  .src-badge {
    flex: none; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-soft); white-space: nowrap;
  }
  .kind-chip {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; margin-right: 6px;
    border-radius: 4px; background: var(--ai-wash); color: var(--ai); vertical-align: 2px;
  }
  .related-count { color: var(--ai); font-weight: 700; }
  .tags-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px;
    font-size: 13px; color: var(--ink-soft);
  }
  .tags-bar .wz-tag { cursor: default; padding: 4px 10px; font-size: 12px; }
  .related-block { margin-top: 22px; }
  .related-block .k { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.03em; margin-bottom: 8px; }
  .related-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5; }
  .related-list .pill { font-size: 10.5px; padding: 1px 7px; margin-right: 4px; }
  .related-src { color: var(--ink-soft); font-size: 11.5px; white-space: nowrap; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12.5px; color: var(--ink-soft); }
  .card-meta .amt { color: var(--gold); font-weight: 700; }
  .card-meta span b { color: var(--ink); font-weight: 600; }

  .empty-state { padding: 60px 20px; text-align: center; color: var(--ink-soft); }
  .empty-state .big { font-size: 34px; margin-bottom: 8px; }

  .load-more { width: 100%; margin-top: 16px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ai); font-weight: 700; font-size: 13.5px; cursor: pointer; }
  .load-more:hover { background: var(--ai-wash); }

  /* ---- Wizard ---- */
  .wizard { max-width: 640px; margin: 0 auto; }
  .wz-progress { display: flex; gap: 6px; margin-bottom: 26px; }
  .wz-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .wz-dot.done { background: var(--ai-soft); }
  .wz-dot.active { background: var(--ai); }
  .wz-step-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--ai-soft); text-transform: uppercase; margin-bottom: 6px; }
  .wz-question { font-family: var(--font-head); font-size: 21px; font-weight: 600; margin: 0 0 18px; text-wrap: balance; }
  .wz-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  .wz-options.single { grid-template-columns: 1fr; }
  .wz-opt {
    text-align: left;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    border-radius: 9px;
    padding: 13px 14px;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
  }
  .wz-opt:hover { border-color: var(--ai-soft); }
  .wz-opt[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-wash); color: var(--ai); font-weight: 700; }
  .wz-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .wz-tag {
    border: 1px solid var(--line); background: var(--paper-raised); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--ink);
  }
  .wz-tag[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-wash); color: var(--gold); font-weight: 700; }
  .wz-free-text { margin-bottom: 18px; }
  .wz-live-count { font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; }
  .wz-live-count b { color: var(--ai); font-size: 15px; }
  .wz-nav { display: flex; justify-content: space-between; gap: 10px; }
  .btn {
    font-size: 14px; font-weight: 700; border-radius: 8px; padding: 11px 20px; cursor: pointer; border: 1px solid transparent;
  }
  .btn-primary { background: var(--ai); color: var(--paper); border-color: var(--ai); }
  .btn-primary:hover { background: var(--ai-soft); border-color: var(--ai-soft); }
  .btn-ghost { background: none; border-color: var(--line); color: var(--ink-soft); }
  .btn-ghost:hover { border-color: var(--ai-soft); color: var(--ai); }

  /* ---- Detail overlay ---- */
  .overlay-bg {
    position: fixed; inset: 0; background: rgba(20, 18, 14, 0.45); backdrop-filter: blur(1px);
    display: flex; justify-content: flex-end; z-index: 40;
  }
  .overlay-panel {
    width: min(480px, 100%); height: 100%; background: var(--paper-raised);
    padding: 26px 24px; overflow-y: auto; box-shadow: -12px 0 30px rgba(0,0,0,0.15);
  }
  .overlay-close { background: none; border: none; color: var(--ink-soft); font-size: 14px; cursor: pointer; padding: 4px 0; margin-bottom: 14px; }
  .overlay-close:hover { color: var(--ai); }
  .overlay-panel h2 { font-family: var(--font-head); font-size: 20px; line-height: 1.5; margin: 0 0 6px; text-wrap: balance; }
  .overlay-org { color: var(--ink-soft); font-size: 13px; margin-bottom: 18px; }
  .card-summary {
    font-size: 13px; line-height: 1.6; color: var(--ink); margin-top: 6px; max-width: 62ch;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .overlay-lead {
    font-size: 14px; line-height: 1.8; margin: -6px 0 20px; padding: 12px 14px;
    background: var(--ai-wash); border-radius: 8px; white-space: pre-line;
  }
  .overlay-sections { margin: -8px 0 24px; }
  .overlay-sections-h { font-size: 12px; font-weight: 700; color: var(--ai); letter-spacing: 0.03em; margin-bottom: 10px; }
  .overlay-sections .overlay-row { margin-bottom: 12px; }
  .sec-body { font-size: 13.5px; line-height: 1.75; white-space: pre-line; overflow-wrap: anywhere; }
  .sec-more { font-size: 12px; color: var(--ink-soft); margin: -12px 0 22px; }
  .overlay-grid { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
  .overlay-row { display: flex; flex-direction: column; gap: 3px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .overlay-row .k { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.03em; }
  .overlay-row .v { font-size: 14.5px; }
  .overlay-row .v.amt { color: var(--gold); font-weight: 700; font-size: 17px; }
  .overlay-link {
    display: block; text-align: center; background: var(--ai); color: var(--paper); text-decoration: none;
    padding: 13px; border-radius: 8px; font-weight: 700; font-size: 14.5px;
  }
  .overlay-link:hover { background: var(--ai-soft); }
  .overlay-note { font-size: 12px; color: var(--ink-soft); margin-top: 14px; line-height: 1.6; }

  footer.site-footer {
    max-width: 1180px; margin: 40px auto 0; padding: 20px 20px 0; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-soft); line-height: 1.8;
  }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>補助金コンパス</h1>
      <span class="tagline">国・自治体の補助金・助成金・給付金を、探しやすく。公開データを毎回同じ場所から検索。</span>
    </div>
    <div class="stats tabular">
      <div class="stat"><div class="num" id="statTotal">-</div><div class="label">掲載件数</div></div>
      <div class="stat"><div class="num" id="statOpen">-</div><div class="label">現在募集中</div></div>
    </div>
  </div>
</div>

<div class="app">
  <div class="tabs" role="tablist">
    <button class="tab-btn" role="tab" id="tabSearchBtn" aria-selected="true">検索する</button>
    <button class="tab-btn" role="tab" id="tabWizardBtn" aria-selected="false">相談する</button>
  </div>

  <section id="searchView">
    <div class="layout">
      <aside class="panel filters">
        <div class="field">
          <label for="fKeyword">キーワード</label>
          <input type="search" id="fKeyword" placeholder="例: 工場 LED（スペース区切りで絞り込み）" />
        </div>
        <div class="field">
          <label for="fPref">対象地域</label>
          <select id="fPref"></select>
        </div>
        <div class="field">
          <label for="fCity">市区町村（県・国の制度も表示）</label>
          <select id="fCity" disabled><option value="">先に都道府県を選択</option></select>
        </div>
        <div class="field">
          <label for="fEmp">従業員数（自社の人数）</label>
          <select id="fEmp">
            <option value="">指定しない</option>
            <option value="20">20名以下</option>
            <option value="100">21〜100名</option>
            <option value="300">101〜300名</option>
            <option value="900">301〜900名</option>
            <option value="901">901名以上</option>
          </select>
        </div>
        <div class="field">
          <label for="fInd">業種（業種の指定がない制度も表示）</label>
          <select id="fInd"></select>
        </div>
        <div class="field">
          <label>補助上限額（不明なものも表示）</label>
          <div class="amt-row">
            <select id="fAmt">
              <option value="">指定しない</option>
              <option value="0-1000000">100万円未満</option>
              <option value="1000000-5000000">100〜500万円</option>
              <option value="5000000-10000000">500〜1000万円</option>
              <option value="10000000-999999999999">1000万円以上</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="fAgency">実施団体・事務局</label>
          <select id="fAgency"></select>
        </div>
        <div class="check-row">
          <input type="checkbox" id="fOpenOnly" checked />
          <label for="fOpenOnly">募集中・受付前のみ表示</label>
        </div>
        <button class="reset-link" id="resetFilters">条件をリセット</button>
      </aside>

      <main>
        <div class="results-head">
          <div class="results-count">全 <b class="tabular" id="rCount">0</b> 件がヒット</div>
          <div class="sort-row">
            <label for="sortSelect">並び替え</label>
            <select id="sortSelect">
              <option value="deadline">締切が近い順</option>
              <option value="new">新着順（掲載日）</option>
              <option value="amountDesc">補助額が高い順</option>
            </select>
          </div>
        </div>
        <div class="tags-bar" id="tagsBar" hidden></div>
        <ul class="card-list" id="cardList"></ul>
        <button class="load-more" id="loadMoreBtn" hidden>もっと見る</button>
      </main>
    </div>
  </section>

  <section id="wizardView" hidden>
    <div class="wizard panel" style="padding:28px 30px;">
      <div class="wz-progress" id="wzProgress"></div>
      <div id="wzStepBody"></div>
      <div class="wz-live-count" id="wzLiveCount"></div>
      <div class="wz-nav">
        <button class="btn btn-ghost" id="wzBack">戻る</button>
        <button class="btn btn-primary" id="wzNext">次へ</button>
      </div>
    </div>
  </section>
</div>

<footer class="site-footer">
  <div>データ出所: デジタル庁「jGrants」公開API（国の補助金・助成金および自治体掲載分）／独立行政法人中小企業基盤整備機構「支援情報ヘッドライン」（都道府県・市区町村独自の補助金・助成金・給付金・融資情報）。主要補助金の受付状況は中小機構「補助金活用ナビ」の公式スケジュールで補正しています。募集内容・締切等の最終判断は必ず各リンク先の公式ページでご確認ください。</div>
  <div id="footUpdated">最終更新: -</div>
</footer>

<script>
const DATA = /*__DATA__*/;
// jGrants carries a few operator test entries (e.g. "テスト_…", "【令和X年度】…" starting in year 3026).
for (let i = DATA.length - 1; i >= 0; i--) if (/^テスト|令和X年度/.test(DATA[i].t)) DATA.splice(i, 1);

// Corrections confirmed against official schedules (data/overrides.json), keyed by record id.
const OVERRIDES = /*__OVERRIDES__*/;
DATA.forEach(r => { if (OVERRIDES[r.id]) Object.assign(r, OVERRIDES[r.id]); });

// Only links confirmed from official sources: SMRJ-run subsidy sites live under smrj.go.jp;
// 全国中央会 is named as ものづくり補助金事務局 in its 公募要領; 持続化補助金 is split into 商工会議所地区/商工会地区.
const AGENCIES = [
  { key: "中小機構", label: "中小機構（中小企業基盤整備機構）",
    test: r => /中小企業基盤整備機構|中小機構/.test(r.o || "") ||
      /(中小企業)?新事業進出補助金|新事業進出・ものづくり商業サービス補助金|中小企業省力化投資補助|デジタル化・AI導入補助金|中小企業成長加速化補助金/.test(r.t) },
  { key: "中小企業団体中央会", label: "中小企業団体中央会（全国・都道府県）",
    test: r => /中小企業団体中央会/.test(r.o || "") ||
      (/ものづくり・商業・サービス生産性向上促進補助金/.test(r.t) && !/新事業進出/.test(r.t)) },
  { key: "商工会議所", label: "商工会議所（日本商工会議所・各地）",

const INDUSTRIES = ["農業、林業","漁業","鉱業、採石業、砂利採取業","建設業","製造業","電気・ガス・熱供給・水道業","情報通信業","運輸業、郵便業","卸売業、小売業","金融業、保険業","不動産業、物品賃貸業","学術研究、専門・技術サービス業","宿泊業、飲食サービス業","生活関連サービス業、娯楽業","教育、学習支援業","医療、福祉","複合サービス事業","サービス業（他に分類されないもの）"];

// Only records with the same real deadline are compared; titles must share a long prefix or one must contain the other.
(function groupDuplicates(){
  const keyOf = r => norm(r._ct.title)
    .replace(/[\s・_\-「」『』【】()<>\[\]、。,.:!?~〜]/g, "")
    .replace(/について|のお知らせ|のご案内|の公募|公募|受付締切|締切分|締切/g, "");
  const parent = new Map();
  const find = x => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  const byD = {};
  DATA.forEach(r => {
    parent.set(r.id, r.id);
    if (r.d && r.d !== "unknown") (byD[r.d] = byD[r.d] || []).push(r);
  });
  const areaOk = (a, b) => a.a.includes("全国") || b.a.includes("全国") || a.a.some(x => b.a.includes(x));
  const lcp = (a, b) => { let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; };
  for (const d in byD) {
    const g = byD[d];
    if (g.length < 2) continue;
    const keys = g.map(keyOf);
    for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) {
      const A = g[i], B = g[j], ka = keys[i], kb = keys[j];

      const [short, long] = ka.length < kb.length ? [ka, kb] : [kb, ka];

const TODAY = new Date(); TODAY.setHours(0,0,0,0);

function parseD(s){ return (s && s !== "unknown") ? new Date(s+"T00:00:00") : null; }

function subsidyStatus(rec){
  if (rec.x === "closed") return "closed";
  if (rec.d === "unknown") return "info";
  const s = parseD(rec.s), d = parseD(rec.d);
  if (s && TODAY < s) return "upcoming";
  if (d && TODAY > d) return "closed";
  return "open";
}

function daysUntil(dateStr){
  const d = parseD(dateStr);
  if (!d) return null;
  return Math.round((d - TODAY) / 86400000);
}

function fmtDate(s){
  if (s === "unknown") return "公式サイトで確認";
  if (!s) return "随時";
  const d = parseD(s);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function fmtDeadline(rec){
  const st = subsidyStatus(rec);
  if (st === "upcoming") return `受付開始: <b>${fmtDate(rec.s)}</b>`;
  const du = daysUntil(rec.d);
  if (st === "open" && du !== null) return `締切: <b>${fmtDate(rec.d)}</b>（${du === 0 ? "本日締切" : `あと${du}日`}）`;
  return `締切: <b>${fmtDate(rec.d)}</b>`;
}

function fmtAmt(m){
  if (m === null || m === undefined) return "上限額の記載なし";
  if (m >= 100000000){
    const oku = Math.floor(m/100000000);
    const man = Math.round((m%100000000)/10000);
    return man > 0 ? `${oku.toLocaleString()}億${man.toLocaleString()}万円` : `${oku.toLocaleString()}億円`;
  }
  if (m % 10000 === 0) return (m/10000).toLocaleString() + "万円";
  return m.toLocaleString() + "円";
}

function empLabel(e){
  if (e === 0) return "従業員数の制約なし";
  if (e === 901) return "901名以上";
  return e.toLocaleString() + "名以下";
}

function matchesPref(rec, pref){
  if (!pref) return true;
  if (rec.a.includes(pref)) return true;
  if (rec.a.includes("全国")) return true;
  for (const block in BLOCKS){
    if (BLOCKS[block].includes(pref) && rec.a.includes(block)) return true;
  }
  return false;
}

function matchesEmpCompanySize(rec, sizeBracket){
  if (!sizeBracket) return true;
  const n = Number(sizeBracket);
  if (rec.e === 0) return true;
  if (rec.e === 901) return n >= 901;
  return n <= rec.e;
}

function isNew(r){

function computeFiltered(s){
  const terms = norm(s.q).split(/\s+/).filter(Boolean);
  const tagTerms = (s.tags || []).flatMap(t => TAG_TERMS[t] || [norm(t)]);
  let list = DATA.filter(rec => {
    if (!terms.every(t => rec._h.includes(t))) return false;
    if (tagTerms.length && !tagTerms.some(t => rec._h.includes(t))) return false;
    if (s.agency && !rec.g.includes(s.agency)) return false;
    if (!matchesPref(rec, s.pref)) return false;
    // A business in a city can use that city's programmes plus prefecture-wide and national ones.
    if (s.city && rec.city && rec.city !== s.city) return false;
    if (s.ind && rec.ind && rec.ind.length && !rec.ind.includes(s.ind)) return false;
    if (!matchesEmpCompanySize(rec, s.emp)) return false;
    if (s.amt){
      const [lo, hi] = s.amt.split("-").map(Number);
      // Most local listings carry no cap; keep them rather than silently dropping possible matches.
      if (rec.m != null && (rec.m < lo || rec.m >= hi)) return false;
    }
    if (s.openOnly){
      const st = subsidyStatus(rec);
      if (st === "closed") return false;
    }
    return true;
  });
  if (s.sort === "deadline"){
    list.sort((a,b) => {
      const pa = parseD(a.d), pb = parseD(b.d);
      const da = pa ? pa.getTime() : Infinity;
      const db = pb ? pb.getTime() : Infinity;
      return da - db;
    });
  } else if (s.sort === "new"){
    list.sort((a,b) => {
      // Posting date for J-Net21, call-start date for jGrants; future dates are not "new".
      const pa = parseD(a.p || a.s), pb = parseD(b.p || b.s);
      const da = pa && pa <= TODAY ? pa.getTime() : 0;
      const db = pb && pb <= TODAY ? pb.getTime() : 0;
      return db - da;
    });

// One entry per programme group, keeping the sort order; `related` = other matching members of the group.
function collapseGroups(list){
  const firstIdx = new Map();
  const out = [];
  for (const rec of list) {
    if (!firstIdx.has(rec._gid)) { firstIdx.set(rec._gid, out.length); out.push({ rec, related: [] }); }
    else out[firstIdx.get(rec._gid)].related.push(rec);
  }
  for (const item of out) {
    item.title = item.rec._ct.title;
    item.maxM = item.rec.m;
    if (!item.related.length) continue;
    const all = [item.rec, ...item.related];
    const best = all.reduce((a, b) => infoScore(b) > infoScore(a) ? b : a);
    item.rec = best;
    item.related = all.filter(r => r !== best);
    const sameSrc = all.filter(r => r.src === best.src);
    item.title = (sameSrc.length > 1 && groupTitle(sameSrc)) || best._ct.title;
    const ms = all.map(r => r.m).filter(m => m != null);
    item.maxM = ms.length ? Math.max(...ms) : null;
  }
  return out;
}

// Shared part of the members' titles, cut back to a natural break (e.g. drop "_PMI推進枠(...)" variants).
function groupTitle(recs){
  const titles = recs.map(r => r._ct.title.normalize("NFKC"));
  let p = titles[0];
  for (const t of titles.slice(1)) { let i = 0; while (i < p.length && i < t.length && p[i] === t[i]) i++; p = p.slice(0, i); }
  if (titles.includes(p)) return p;
  const cut = Math.max(...["_", "(", "<", "[", "「", " "].map(c => p.lastIndexOf(c)));
  const t = (cut > 0 ? p.slice(0, cut) : "").replace(/[_\s・]+$/, "");
  return t.length >= 12 ? t : "";
}

// ---- Summaries extracted verbatim from the official text (no rewriting) ----
const TXT_CAP = { national: 1200, local: 600 };
function cleanTxt(t){
  return t
    .replace(/申(込|請)方法ほか詳細情報は、?「詳細情報を見る」からご確認(ください|下さい)。?/g, "")

// Where the descriptive lead ends and admin details (期間・人数・■見出し…) begin.
const META_RE = /■|【|※|(指定)?(受付|募集|申請|公募|応募|申込)(受付)?(期間|期限|期日)[:：]|募集人数[:：]|補助対象期間[:：]/;
function summaryOf(rec){
  if (!rec.txt) return "";
  if (rec._sum !== undefined) return rec._sum;
  // The lead paragraph, or failing that the first section with real content (e.g. "■目的 …").
  const secs = sectionsOf(rec);
  const src = secs.find(s => !s.h) || secs.find(s => s.body.length >= 20);
  if (!src) return rec._sum = "";
  let t = src.body;
  const cut = t.search(META_RE);
  if (cut > 15) t = t.slice(0, cut).trim();
  let out = "";
  // Whole sentences up to ~120 chars; a very short opener ("…は発展の要です。") pulls in the next one.
  for (const s of t.split(/(?<=。)/)) { if (out.length >= 40 && (out + s).length > 120) break; out += s; }
  out = out.trim();
  return rec._sum = out.length > 120 ? out.slice(0, 118) + "…" : out;
}
// "■応募資格 …■補助率 …" → [{h, body}]; the text before the first ■ is the lead.
function sectionsOf(rec){
  if (!rec.txt) return [];
  const parts = cleanTxt(rec.txt).split(/■\s*/);
  const out = [];
  for (const [i, p] of parts.entries()) {
    if (!p.trim()) continue;
    const m = i > 0 && p.match(/^([^\s：:。]{2,16})(?:[\s：:]+([\s\S]*))?$/);
    const sec = m ? { h: m[1], body: (m[2] || "").trim() } : { h: i === 0 ? "" : "その他", body: p.trim() };
    if (sec.body) out.push(sec);  // drop headings left empty in the form
  }
  // The cached text is capped, so its tail may be a half-cut URL that would open the wrong page.
  const last = out[out.length - 1];
  if (last && isTruncated(rec)) last.body = last.body.replace(/\s*https?:\/\/\S*$/, "").replace(/\s*$/, "…");

}

const lineBreakMeta = s => s.replace(/\s+(?=[^\s：:。、]{2,12}[：:])/g, "\n").replace(/\s+(?=[（(][0-9０-９]+[）)]|[①-⑩]|[ア-オ]）)/g, "\n");

const linkify = html => html.replace(/https?:\/\/[^\s<>"'）)」]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

function kindChip(rec){

function cardHtml(item){
  const rec = item.rec;
  return `<li class="card" tabindex="0" data-id="${escapeHtml(rec.id)}">
    <div class="card-top">
      <div>
        <div class="card-title">${kindChip(rec)}${escapeHtml(item.title)}</div>
        ${rec.o ? `<div class="card-org">${escapeHtml(rec.o)}</div>` : ""}
        ${summaryOf(rec) ? `<div class="card-summary">${escapeHtml(summaryOf(rec))}</div>` : ""}
      </div>
      <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
        ${statusPill(rec)}
        ${srcBadge(rec)}
      </div>
    </div>
    <div class="card-meta tabular">
      <span>📍 ${rec.a.includes("全国") ? "全国" : rec.a.slice(0,3).join("・") + (rec.a.length>3 ? " ほか" : "")}</span>
      ${rec.e ? `<span>👥 <b>${empLabel(rec.e)}</b></span>` : ""}
      ${item.maxM != null ? `<span class="amt">上限 ${item.related.length ? "最大" : ""}${fmtAmt(item.maxM)}</span>` : ""}
      <span>${fmtDeadline(rec)}</span>
      ${rec.ind && rec.ind.length ? `<span>🏭 ${escapeHtml(rec.ind.slice(0, 2).join("・"))}${rec.ind.length > 2 ? " ほか" : ""}</span>` : ""}
      ${rec.g.length ? `<span>🏢 ${escapeHtml(rec.g.join("・"))}</span>` : ""}
      ${item.related.length ? `<span class="related-count">＋同じ制度の別枠・別掲載 ${item.related.length}件</span>` : ""}
    </div>
  </li>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderTagsBar(){
  const bar = document.getElementById("tagsBar");
  bar.hidden = !state.tags.length;
  bar.innerHTML = state.tags.length
    ? `目的（いずれかに該当）: ${state.tags.map(t => `<span class="wz-tag" aria-pressed="true">${escapeHtml(t)}</span>`).join("")}<button class="reset-link" id="clearTags">目的の条件を外す</button>`
    : "";
  if (state.tags.length) document.getElementById("clearTags").addEventListener("click", () => { state.tags = []; visibleCount = 30; renderResults(); });
}

let currentItems = [];
function renderResults(){
  renderTagsBar();
  const items = collapseGroups(computeFiltered(state));
  currentItems = items;
  document.getElementById("rCount").textContent = items.length.toLocaleString();
  const slice = items.slice(0, visibleCount);
  const el = document.getElementById("cardList");
  if (slice.length === 0){
    el.innerHTML = `<div class="empty-state"><div class="big">🔍</div>該当する補助金が見つかりませんでした。<br>条件を緩めてもう一度お試しください。</div>`;
  } else {
    el.innerHTML = slice.map(cardHtml).join("");
  }
  document.getElementById("loadMoreBtn").hidden = items.length <= visibleCount;
  el.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openDetail(card.dataset.id));
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(card.dataset.id); } });
  });
}

function openDetail(id){
  const rec = DATA.find(r => r.id === id);
  if (!rec) return;
  const item = currentItems.find(it => it.rec === rec);
  const related = item ? item.related : [];
  const relatedHtml = related.length ? `<div class="related-block">
      <div class="k">同じ制度の別枠・別掲載（${related.length}件）</div>
      <ul class="related-list">${related.map(r => `<li>${statusPill(r)} <a href="${escapeHtml(r.u)}" target="_blank" rel="noopener">${escapeHtml(r._ct.title)}</a> <span class="related-src">${r.src === "local" ? "支援情報ヘッドライン" : r.src === "maff" ? "公式サイト" : "jGrants"}</span></li>`).join("")}</ul>
    </div>` : "";
  const bg = document.createElement("div");
  bg.className = "overlay-bg";
  const areaText = rec.a.includes("全国") ? "全国（全47都道府県が対象）" : rec.a.join(" / ");
  const descRow = rec.desc ? `<div class="overlay-row"><div class="k">概要（配信元テキストそのまま）</div><div class="v">${escapeHtml(rec.desc)}</div></div>` : "";
  const linkLabel = rec.src === "local" ? "支援情報ヘッドラインで詳細を見る ↗" : rec.src === "maff" ? "事務局サイトで詳細・申請要領を見る ↗" : "公式jGrantsで詳細・申請要領を見る ↗";
  const allSections = sectionsOf(rec);
  const lead = allSections.length && !allSections[0].h ? allSections[0].body : "";
  const sections = allSections.filter(s => s.h);
  bg.innerHTML = `<div class="overlay-panel" role="dialog" aria-modal="true">
    <button class="overlay-close" id="ovClose">← 一覧に戻る</button>
    <div style="display:flex; gap:8px; margin-bottom:10px;">${statusPill(rec)}${srcBadge(rec)}</div>
    <h2>${kindChip(rec)}${escapeHtml(rec._ct.title)}</h2>
    <div class="overlay-org">${escapeHtml(orgOf(rec))}</div>
    ${lead ? `<p class="overlay-lead">${escapeHtml(lineBreakMeta(lead))}</p>` : ""}
    <div class="overlay-grid">
      <div class="overlay-row"><div class="k">補助上限額</div><div class="v amt tabular">${fmtAmt(rec.m)}</div></div>
      ${rec.rate ? `<div class="overlay-row"><div class="k">補助率</div><div class="v">${escapeHtml(rec.rate)}</div></div>` : ""}
      <div class="overlay-row"><div class="k">受付期間</div><div class="v tabular">${fmtDate(rec.s)} 〜 ${fmtDate(rec.d)}</div></div>
      ${rec.p ? `<div class="overlay-row"><div class="k">掲載日</div><div class="v tabular">${fmtDate(rec.p)}</div></div>` : ""}
      <div class="overlay-row"><div class="k">対象従業員数</div><div class="v">${empLabel(rec.e)}</div></div>
      <div class="overlay-row"><div class="k">対象地域</div><div class="v">${escapeHtml(areaText)}${rec.city ? `（${escapeHtml(rec.city)}）` : ""}</div></div>
      ${rec.ind ? `<div class="overlay-row"><div class="k">対象業種</div><div class="v">${rec.ind.length ? escapeHtml(rec.ind.join(" / ")) : "業種の指定なし"}</div></div>` : ""}
      ${rec.pur ? `<div class="overlay-row"><div class="k">利用目的</div><div class="v">${escapeHtml(rec.pur.join(" / "))}</div></div>` : ""}
      ${rec.g.length ? `<div class="overlay-row"><div class="k">実施団体・事務局</div><div class="v">${escapeHtml(rec.g.map(k => AGENCIES.find(a => a.key === k).label).join(" / "))}</div></div>` : ""}
      ${rec.n ? `<div class="overlay-row"><div class="k">補足</div><div class="v">${escapeHtml(rec.n)}</div></div>` : ""}
      ${descRow}
    </div>
    ${sections.length ? `<div class="overlay-sections">
      <div class="overlay-sections-h">公募情報（公式の記載をそのまま掲載）</div>
      ${sections.map(s => `<div class="overlay-row"><div class="k">${escapeHtml(s.h)}</div><div class="v sec-body">${linkify(escapeHtml(lineBreakMeta(s.body)))}</div></div>`).join("")}
      ${isTruncated(rec) ? `<div class="sec-more">※ 長いため途中までを表示しています。続きは公式ページでご確認ください。</div>` : ""}
    </div>` : (lead && isTruncated(rec) ? `<div class="sec-more">※ 長いため途中までを表示しています。続きは公式ページでご確認ください。</div>` : "")}
    ${rec.srcUrl ? `<a class="overlay-link" href="${escapeHtml(rec.srcUrl)}" target="_blank" rel="noopener">実施機関の公式ページを開く ↗</a>
    <a class="overlay-link secondary" href="${escapeHtml(rec.u)}" target="_blank" rel="noopener">${linkLabel}</a>`
    : `<a class="overlay-link" href="${escapeHtml(rec.u)}" target="_blank" rel="noopener">${linkLabel}</a>`}
    ${relatedHtml}
    <div class="overlay-note">${rec.src === "local" ? "本アプリは中小機構「支援情報ヘッドライン」の情報をもとに一覧化した参考情報です。" : rec.src === "maff" ? "本アプリで手動で追加した情報です。" : "本アプリはjGrants公開APIの情報をもとに一覧化した参考情報です。"}申請条件・締切の正式な内容は必ずリンク先の公式ページでご確認ください。</div>
  </div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
  document.getElementById("ovClose").addEventListener("click", () => bg.remove());
}

/* ---------------- filter panel wiring ---------------- */
function fillCities(){
  const sel = document.getElementById("fCity");
  const cities = state.pref && CITIES_BY_PREF[state.pref] ? [...CITIES_BY_PREF[state.pref]].sort((a, b) => a.localeCompare(b, "ja")) : [];
  if (!cities.includes(state.city)) state.city = "";
  sel.disabled = !cities.length;
  sel.innerHTML = !state.pref ? `<option value="">先に都道府県を選択</option>`
    : !cities.length ? `<option value="">この県の市区町村の制度は未掲載</option>`
    : `<option value="">指定しない</option>` + cities.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  sel.value = state.city;
}

function initFilterPanel(){
  const sel = document.getElementById("fPref");
  sel.innerHTML = `<option value="">指定しない</option>` + PREF_LIST.map(p => `<option value="${p}">${p}</option>`).join("");
  document.getElementById("fAgency").innerHTML = `<option value="">指定しない</option>` +
    AGENCIES.map(a => `<option value="${a.key}">${a.label}（${DATA.filter(r => r.g.includes(a.key)).length.toLocaleString()}件）</option>`).join("");
  document.getElementById("fAgency").addEventListener("change", e => { state.agency = e.target.value; visibleCount = 30; renderResults(); });

  document.getElementById("fKeyword").addEventListener("input", e => { state.q = e.target.value.trim(); visibleCount = 30; renderResults(); });
  document.getElementById("fPref").addEventListener("change", e => { state.pref = e.target.value; fillCities(); visibleCount = 30; renderResults(); });
  document.getElementById("fCity").addEventListener("change", e => { state.city = e.target.value; visibleCount = 30; renderResults(); });
  document.getElementById("fInd").innerHTML = `<option value="">指定しない</option>` + INDUSTRIES.map(j => `<option value="${j}">${j}</option>`).join("");
  document.getElementById("fInd").addEventListener("change", e => { state.ind = e.target.value; visibleCount = 30; renderResults(); });
  document.getElementById("fEmp").addEventListener("change", e => { state.emp = e.target.value; visibleCount = 30; renderResults(); });
  document.getElementById("fAmt").addEventListener("change", e => { state.amt = e.target.value; visibleCount = 30; renderResults(); });
  document.getElementById("fOpenOnly").addEventListener("change", e => { state.openOnly = e.target.checked; visibleCount = 30; renderResults(); });
  document.getElementById("sortSelect").addEventListener("change", e => { state.sort = e.target.value; renderResults(); });
  document.getElementById("loadMoreBtn").addEventListener("click", () => { visibleCount += 30; renderResults(); });
  document.getElementById("resetFilters").addEventListener("click", () => {
    state.q=""; state.tags=[]; state.pref=""; state.city=""; state.emp=""; state.ind=""; state.amt=""; state.agency=""; state.openOnly=true; state.sort="deadline";
    document.getElementById("fInd").value="";
    fillCities();
    document.getElementById("fAgency").value="";
    document.getElementById("fKeyword").value="";
    document.getElementById("fPref").value="";
    document.getElementById("fEmp").value="";
    document.getElementById("fAmt").value="";
    document.getElementById("fOpenOnly").checked=true;
    document.getElementById("sortSelect").value="deadline";
    visibleCount = 30;
    renderResults();
  });
}

/* ---------------- tabs ---------------- */
function initTabs(){
  const searchBtn = document.getElementById("tabSearchBtn");
  const wizardBtn = document.getElementById("tabWizardBtn");
  const searchView = document.getElementById("searchView");
  const wizardView = document.getElementById("wizardView");
  searchBtn.addEventListener("click", () => {
    searchBtn.setAttribute("aria-selected","true"); wizardBtn.setAttribute("aria-selected","false");
    searchView.hidden = false; wizardView.hidden = true;
  });
  wizardBtn.addEventListener("click", () => {
    wizardBtn.setAttribute("aria-selected","true"); searchBtn.setAttribute("aria-selected","false");
    searchView.hidden = true; wizardView.hidden = false;
    renderWizardStep();
  });
}

/* ---------------- wizard ---------------- */
const wz = { step: 0, pref: "", emp: "", tags: [], amt: "", openOnly: true };
const WZ_STEPS = ["地域","従業員数","目的","予算感","確認"];

function wzLiveCountText(){
  const n = collapseGroups(computeFiltered(wzFilteredStateUpTo())).length;
  return `現在の条件に合う補助金: <b class="tabular">${n.toLocaleString()}</b> 件`;
}
// Includes the answer on the current step, so the count reacts as soon as an option is picked.
function wzFilteredStateUpTo(){
  const s = { q:"", tags: [], pref: wz.pref, emp:"", amt:"", agency:"", openOnly: true, sort:"deadline" };
  if (wz.step >= 1) s.emp = wz.emp;
  if (wz.step >= 2) { s.tags = wz.tags.slice(); s.q = wz.freeText || ""; }
  if (wz.step >= 3) s.amt = wz.amt;
  return s;
}

function renderWizardStep(){
  const body = document.getElementById("wzStepBody");
  const progress = document.getElementById("wzProgress");
  progress.innerHTML = WZ_STEPS.map((_,i) => `<div class="wz-dot ${i<wz.step?'done':(i===wz.step?'active':'')}"></div>`).join("");

  const nextBtn = document.getElementById("wzNext");
  const backBtn = document.getElementById("wzBack");
  backBtn.style.visibility = wz.step === 0 ? "hidden" : "visible";

  if (wz.step === 0){
    body.innerHTML = `<div class="wz-step-label">STEP 1 / ${WZ_STEPS.length}</div>
      <h2 class="wz-question">事業を営んでいる地域は？</h2>
      <select id="wzPrefSel" style="margin-bottom:20px;"></select>`;
    const s = document.getElementById("wzPrefSel");
    s.innerHTML = `<option value="">問わない（全国から探す）</option>` + PREF_LIST.map(p => `<option value="${p}" ${p===wz.pref?'selected':''}>${p}</option>`).join("");
    s.addEventListener("change", e => { wz.pref = e.target.value; updateLiveCount(); });
    nextBtn.textContent = "次へ";
  } else if (wz.step === 1){
    body.innerHTML = `<div class="wz-step-label">STEP 2 / ${WZ_STEPS.length}</div>
      <h2 class="wz-question">従業員数はどのくらいですか？</h2>
      <div class="wz-options single" id="wzEmpOpts">
        ${[["","指定しない"],["20","20名以下"],["100","21〜100名"],["300","101〜300名"],["900","301〜900名"],["901","901名以上"]]
          .map(([v,l]) => `<button class="wz-opt" data-v="${v}" aria-pressed="${wz.emp===v}">${l}</button>`).join("")}
      </div>`;
    body.querySelectorAll("#wzEmpOpts .wz-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        wz.emp = btn.dataset.v;
        body.querySelectorAll("#wzEmpOpts .wz-opt").forEach(b => b.setAttribute("aria-pressed", b===btn));
        updateLiveCount();
      });
    });
    nextBtn.textContent = "次へ";
  } else if (wz.step === 2){
    body.innerHTML = `<div class="wz-step-label">STEP 3 / ${WZ_STEPS.length}</div>
      <h2 class="wz-question">どんな目的の補助金をお探しですか？（複数選択可）</h2>
      <div class="wz-tags" id="wzTagOpts">
        ${PURPOSE_TAGS.map(t => `<button class="wz-tag" data-v="${t}" aria-pressed="${wz.tags.includes(t)}">${t}</button>`).join("")}
      </div>
      <div class="wz-free-text field">
        <label for="wzFreeText">その他キーワードで探す（任意）</label>
        <input type="text" id="wzFreeText" placeholder="例: 農業、店舗改装" value="${wz.freeText||''}"/>
      </div>`;
    body.querySelectorAll("#wzTagOpts .wz-tag").forEach(btn => {
      btn.addEventListener("click", () => {
        const v = btn.dataset.v;
        const idx = wz.tags.indexOf(v);
        if (idx === -1) wz.tags.push(v); else wz.tags.splice(idx,1);
        btn.setAttribute("aria-pressed", wz.tags.includes(v));
        updateLiveCount();
      });
    });
    document.getElementById("wzFreeText").addEventListener("input", e => {
      wz.freeText = e.target.value.trim();
      updateLiveCount();
    });
    nextBtn.textContent = "次へ";
  } else if (wz.step === 3){
    body.innerHTML = `<div class="wz-step-label">STEP 4 / ${WZ_STEPS.length}</div>
      <h2 class="wz-question">希望する補助上限額の目安は？</h2>
      <p style="margin:-8px 0 16px; font-size:13px; color:var(--ink-soft);">上限額が公表されていない補助金も、候補として残します。</p>
      <div class="wz-options single" id="wzAmtOpts">
        ${[["","指定しない"],["0-1000000","100万円未満"],["1000000-5000000","100〜500万円"],["5000000-10000000","500〜1000万円"],["10000000-999999999999","1000万円以上"]]
          .map(([v,l]) => `<button class="wz-opt" data-v="${v}" aria-pressed="${wz.amt===v}">${l}</button>`).join("")}
      </div>`;
    body.querySelectorAll("#wzAmtOpts .wz-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        wz.amt = btn.dataset.v;
        body.querySelectorAll("#wzAmtOpts .wz-opt").forEach(b => b.setAttribute("aria-pressed", b===btn));
        updateLiveCount();
      });
    });
    nextBtn.textContent = "結果を見る";
  } else if (wz.step === 4){
    state.tags = wz.tags.slice();
    state.q = wz.freeText || "";
    state.pref = wz.pref; state.city = ""; state.emp = wz.emp; state.ind = ""; state.amt = wz.amt; state.agency = ""; state.openOnly = true; state.sort = "deadline";
    document.getElementById("fAgency").value = "";
    document.getElementById("fInd").value = "";
    visibleCount = 30;
    document.getElementById("fKeyword").value = state.q;
    document.getElementById("fPref").value = state.pref;
    fillCities();
    document.getElementById("fEmp").value = state.emp;
    document.getElementById("fAmt").value = state.amt;
    document.getElementById("fOpenOnly").checked = true;
    document.getElementById("sortSelect").value = "deadline";
    renderResults();
    document.getElementById("tabSearchBtn").click();
    return;
  }
  updateLiveCount();
}

function updateLiveCount(){
  document.getElementById("wzLiveCount").innerHTML = wzLiveCountText();
}

function initWizardNav(){
  document.getElementById("wzNext").addEventListener("click", () => { wz.step = Math.min(wz.step+1, WZ_STEPS.length-1); renderWizardStep(); });
  document.getElementById("wzBack").addEventListener("click", () => { wz.step = Math.max(wz.step-1, 0); renderWizardStep(); });
}

/* ---------------- boot ---------------- */
function boot(){
  document.getElementById("statTotal").textContent = DATA.length.toLocaleString();
  const openCount = collapseGroups(DATA.filter(r => subsidyStatus(r) !== "closed")).length;
  document.getElementById("statOpen").textContent = openCount.toLocaleString();
  document.getElementById("footUpdated").textContent = "データ取得日: " + fmtDate(BUILD_INFO.date);
  initFilterPanel();
  initTabs();
  initWizardNav();
  renderResults();
}
boot();
</script>
