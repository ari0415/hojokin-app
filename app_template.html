<title>補助金コンパス</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>

      --ai-soft: #4E6F94;
      --ai-wash: #202C38;
      --gold: #D9AE63;
      --gold-wash: #302A1C;
      --line: #2C323B;
      --ok: #7FC28F;
      --ok-wash: #1E2C21;
      --warn: #D08A4C;

    --paper: #14181D;

    --ink: #EDEAE1;
    --ink-soft: #B4AEA0;

  /* ---- Detail overlay ---- */
  .overlay-bg {

  footer.site-footer {

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="topbar">

  <div class="tabs" role="tablist">

            <option value="">指定しない</option>

              <option value="">指定しない</option>

              <option value="deadline">締切が近い順</option>

<footer class="site-footer">
  <div>データ出所: デジタル庁「jGrants」公開API（国の補助金および自治体掲載分）／独立行政法人中小企業基盤整備機構「支援情報ヘッドライン」RSS（市区町村独自の補助金情報。日次で自動追加され、掲載件数は徐々に増えていきます）。募集内容・締切等の最終判断は必ず各リンク先の公式ページでご確認ください。</div>
  <div id="footUpdated">最終更新: -</div>
</footer>

<script>
const DATA = /*__DATA__*/;

const PREF_LIST = ["全国","北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県","海外"];

const BLOCKS = {
  "北海道地方": ["北海道"],
  "東北地方": ["青森県","岩手県","宮城県","秋田県","山形県","福島県"],
  "関東・甲信越地方": ["茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","山梨県","長野県"],
  "東海・北陸地方": ["富山県","石川県","福井県","岐阜県","静岡県","愛知県","三重県"],
  "近畿地方": ["滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県"],
  "中国地方": ["鳥取県","島根県","岡山県","広島県","山口県"],
  "四国地方": ["徳島県","香川県","愛媛県","高知県"],
  "九州・沖縄地方": ["福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]
};

const PURPOSE_TAGS = ["IT導入","設備投資","創業・起業","事業承継","雇用・人材","海外展開","省エネ・脱炭素","観光","研究開発","販路開拓","デジタル化","女性活躍"];

const TODAY = new Date(); TODAY.setHours(0,0,0,0);

function parseD(s){ return (s && s !== "unknown") ? new Date(s+"T00:00:00") : null; }

function subsidyStatus(rec){
  if (rec.d === "unknown") return "info";
  const s = parseD(rec.s), d = parseD(rec.d);
  if (s && TODAY < s) return "upcoming";
  if (d && TODAY > d) return "closed";
  return "open";
}

function daysUntil(dateStr){
  const d = parseD(dateStr);
  if (!d) return null;
  return Math.round((d - TODAY) / 86400000);
}

function fmtDate(s){
  if (s === "unknown") return "公式サイトで確認";
  if (!s) return "随時";
  const d = parseD(s);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function fmtAmt(m){
  if (m === null || m === undefined) return "上限額の記載なし";
  if (m >= 100000000){
    const oku = Math.floor(m/100000000);
    const man = Math.round((m%100000000)/10000);
    return man > 0 ? `${oku.toLocaleString()}億${man.toLocaleString()}万円` : `${oku.toLocaleString()}億円`;
  }
  if (m % 10000 === 0) return (m/10000).toLocaleString() + "万円";
  return m.toLocaleString() + "円";
}

function empLabel(e){
  if (e === 0) return "従業員数の制約なし";
  if (e === 901) return "901名以上";
  return e.toLocaleString() + "名以下";
}

function matchesPref(rec, pref){
  if (!pref) return true;
  if (rec.a.includes(pref)) return true;
  if (rec.a.includes("全国")) return true;
  for (const block in BLOCKS){
    if (BLOCKS[block].includes(pref) && rec.a.includes(block)) return true;
  }
  return false;
}

function matchesEmpCompanySize(rec, sizeBracket){
  if (!sizeBracket) return true;
  const n = Number(sizeBracket);
  if (rec.e === 0) return true;
  if (rec.e === 901) return n >= 901;
  return n <= rec.e;
}

function orgOf(rec){ return rec.o || "実施機関の記載なし"; }

/* ---------------- shared filter state ---------------- */
const state = { q: "", pref: "", emp: "", amt: "", openOnly: true, sort: "deadline" };
let visibleCount = 30;

function computeFiltered(s){
  let list = DATA.filter(rec => {
    if (s.q){
      const hay = (rec.t + " " + orgOf(rec)).toLowerCase();
      if (!hay.includes(s.q.toLowerCase())) return false;
    }
    if (!matchesPref(rec, s.pref)) return false;
    if (!matchesEmpCompanySize(rec, s.emp)) return false;
    if (s.amt){
      const [lo, hi] = s.amt.split("-").map(Number);
      if (rec.m === null || rec.m < lo || rec.m >= hi) return false;
    }
    if (s.openOnly){
      const st = subsidyStatus(rec);
      if (st === "closed") return false;
    }
    return true;
  });
  if (s.sort === "deadline"){
    list.sort((a,b) => {
      const da = a.d ? parseD(a.d).getTime() : Infinity;
      const db = b.d ? parseD(b.d).getTime() : Infinity;
      return da - db;
    });
  } else if (s.sort === "new"){
    list.sort((a,b) => {
      const da = a.s ? parseD(a.s).getTime() : 0;
      const db = b.s ? parseD(b.s).getTime() : 0;
      return db - da;
    });
  } else if (s.sort === "amountDesc"){
    list.sort((a,b) => (b.m||0) - (a.m||0));
  }
  return list;
}

/* ---------------- rendering ---------------- */
function statusPill(rec){
  const st = subsidyStatus(rec);
  if (st === "info") return `<span class="pill pill-info">自治体情報・要確認</span>`;
  if (st === "upcoming") return `<span class="pill pill-upcoming">受付前</span>`;
  if (st === "closed") return `<span class="pill pill-closed">終了</span>`;
  const du = daysUntil(rec.d);
  if (du !== null && du <= 7) return `<span class="pill pill-soon">まもなく締切</span>`;
  return `<span class="pill pill-open">募集中</span>`;
}

function srcBadge(rec){
  return rec.src === "local" ? `<span class="src-badge">自治体独自</span>` : `<span class="src-badge">jGrants</span>`;
}

function cardHtml(rec){
  return `<li class="card" tabindex="0" data-id="${escapeHtml(rec.id)}">
    <div class="card-top">
      <div>
        <div class="card-title">${escapeHtml(rec.t)}</div>
        <div class="card-org">${escapeHtml(orgOf(rec))}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
        ${statusPill(rec)}
        ${srcBadge(rec)}
      </div>
    </div>
    <div class="card-meta tabular">
      <span>📍 ${rec.a.includes("全国") ? "全国" : rec.a.slice(0,3).join("・") + (rec.a.length>3 ? " ほか" : "")}</span>
      <span>👥 <b>${empLabel(rec.e)}</b></span>
      <span class="amt">${fmtAmt(rec.m)}</span>
      <span>締切: <b>${fmtDate(rec.d)}</b></span>
    </div>
  </li>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderResults(){
  const list = computeFiltered(state);
  document.getElementById("rCount").textContent = list.length.toLocaleString();
  const slice = list.slice(0, visibleCount);
  const el = document.getElementById("cardList");
  if (slice.length === 0){
    el.innerHTML = `<div class="empty-state"><div class="big">🔍</div>該当する補助金が見つかりませんでした。<br>条件を緩めてもう一度お試しください。</div>`;
  } else {
    el.innerHTML = slice.map(cardHtml).join("");
  }
  document.getElementById("loadMoreBtn").hidden = list.length <= visibleCount;
  el.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openDetail(card.dataset.id));
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(card.dataset.id); } });
  });
}

function openDetail(id){
  const rec = DATA.find(r => r.id === id);
  if (!rec) return;
  const bg = document.createElement("div");
  bg.className = "overlay-bg";
  const areaText = rec.a.includes("全国") ? "全国（全47都道府県が対象）" : rec.a.join(" / ");
  const descRow = rec.desc ? `<div class="overlay-row"><div class="k">概要（配信元テキストそのまま）</div><div class="v">${escapeHtml(rec.desc)}</div></div>` : "";
  const linkLabel = rec.src === "local" ? "支援情報ヘッドラインで詳細を見る ↗" : "公式jGrantsで詳細・申請要領を見る ↗";
  bg.innerHTML = `<div class="overlay-panel" role="dialog" aria-modal="true">
    <button class="overlay-close" id="ovClose">← 一覧に戻る</button>
    <div style="display:flex; gap:8px; margin-bottom:10px;">${statusPill(rec)}${srcBadge(rec)}</div>
    <h2>${escapeHtml(rec.t)}</h2>
    <div class="overlay-org">${escapeHtml(orgOf(rec))}</div>
    <div class="overlay-grid">
      <div class="overlay-row"><div class="k">補助上限額</div><div class="v amt tabular">${fmtAmt(rec.m)}</div></div>
      <div class="overlay-row"><div class="k">受付期間</div><div class="v tabular">${fmtDate(rec.s)} 〜 ${fmtDate(rec.d)}</div></div>
      <div class="overlay-row"><div class="k">対象従業員数</div><div class="v">${empLabel(rec.e)}</div></div>
      <div class="overlay-row"><div class="k">対象地域</div><div class="v">${escapeHtml(areaText)}</div></div>
      ${descRow}
    </div>
    <a class="overlay-link" href="${escapeHtml(rec.u)}" target="_blank" rel="noopener">${linkLabel}</a>
    <div class="overlay-note">${rec.src === "local" ? "本アプリは中小機構「支援情報ヘッドライン」のRSS配信情報をもとに一覧化した参考情報です。" : "本アプリはjGrants公開APIの情報をもとに一覧化した参考情報です。"}申請条件・締切の正式な内容は必ずリンク先の公式ページでご確認ください。</div>
  </div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
  document.getElementById("ovClose").addEventListener("click", () => bg.remove());
}

/* ---------------- filter panel wiring ---------------- */
function initFilterPanel(){
  const sel = document.getElementById("fPref");
  sel.innerHTML = `<option value="">指定しない</option>` + PREF_LIST.map(p => `<option value="${p}">${p}</option>`).join("");

  document.getElementById("fKeyword").addEventListener("input", e => { state.q = e.target.value.trim(); visibleCount = 30; renderResults(); });
  document.getElementById("fPref").addEventListener("change", e => { state.pref = e.target.value; visibleCount = 30; renderResults(); });
  document.getElementById("fEmp").addEventListener("change", e => { state.emp = e.target.value; visibleCount = 30; renderResults(); });
  document.getElementById("fAmt").addEventListener("change", e => { state.amt = e.target.value; visibleCount = 30; renderResults(); });
  document.getElementById("fOpenOnly").addEventListener("change", e => { state.openOnly = e.target.checked; visibleCount = 30; renderResults(); });
  document.getElementById("sortSelect").addEventListener("change", e => { state.sort = e.target.value; renderResults(); });
  document.getElementById("loadMoreBtn").addEventListener("click", () => { visibleCount += 30; renderResults(); });
  document.getElementById("resetFilters").addEventListener("click", () => {
    state.q=""; state.pref=""; state.emp=""; state.amt=""; state.openOnly=true; state.sort="deadline";
    document.getElementById("fKeyword").value="";
    document.getElementById("fPref").value="";
    document.getElementById("fEmp").value="";
    document.getElementById("fAmt").value="";
    document.getElementById("fOpenOnly").checked=true;
    document.getElementById("sortSelect").value="deadline";
    visibleCount = 30;
    renderResults();
  });
}

/* ---------------- tabs ---------------- */
function initTabs(){
  const searchBtn = document.getElementById("tabSearchBtn");
  const wizardBtn = document.getElementById("tabWizardBtn");
  const searchView = document.getElementById("searchView");
  const wizardView = document.getElementById("wizardView");
  searchBtn.addEventListener("click", () => {
    searchBtn.setAttribute("aria-selected","true"); wizardBtn.setAttribute("aria-selected","false");
    searchView.hidden = false; wizardView.hidden = true;
  });
  wizardBtn.addEventListener("click", () => {
    wizardBtn.setAttribute("aria-selected","true"); searchBtn.setAttribute("aria-selected","false");
    searchView.hidden = true; wizardView.hidden = false;
    renderWizardStep();
  });
}

/* ---------------- wizard ---------------- */
const wz = { step: 0, pref: "", emp: "", tags: [], amt: "", openOnly: true };
const WZ_STEPS = ["地域","従業員数","目的","予算感","確認"];

function wzFilteredState(){
  return { q: wz.tags.join(" "), pref: wz.pref, emp: wz.emp, amt: wz.amt, openOnly: wz.openOnly, sort: "deadline" };
}

function wzLiveCountText(){
  if (wz.step === 0) return "";
  const n = computeFiltered(wzFilteredStateUpTo()).length;
  return `現在の条件に合う補助金: <b class="tabular">${n.toLocaleString()}</b> 件`;
}
function wzFilteredStateUpTo(){
  const s = { q:"", pref:"", emp:"", amt:"", openOnly: true, sort:"deadline" };
  if (wz.step >= 1) s.pref = wz.pref;
  if (wz.step >= 2) s.emp = wz.emp;
  if (wz.step >= 3) s.q = wz.tags.join(" ");
  if (wz.step >= 4) s.amt = wz.amt;
  return s;
}

function renderWizardStep(){
  const body = document.getElementById("wzStepBody");
  const progress = document.getElementById("wzProgress");
  progress.innerHTML = WZ_STEPS.map((_,i) => `<div class="wz-dot ${i<wz.step?'done':(i===wz.step?'active':'')}"></div>`).join("");

  const nextBtn = document.getElementById("wzNext");
  const backBtn = document.getElementById("wzBack");
  backBtn.style.visibility = wz.step === 0 ? "hidden" : "visible";

  if (wz.step === 0){
    body.innerHTML = `<div class="wz-step-label">STEP 1 / ${WZ_STEPS.length}</div>
      <h2 class="wz-question">事業を営んでいる地域は？</h2>
      <select id="wzPrefSel" style="margin-bottom:20px;"></select>`;
    const s = document.getElementById("wzPrefSel");
    s.innerHTML = `<option value="">問わない（全国から探す）</option>` + PREF_LIST.map(p => `<option value="${p}" ${p===wz.pref?'selected':''}>${p}</option>`).join("");
    s.addEventListener("change", e => { wz.pref = e.target.value; updateLiveCount(); });
    nextBtn.textContent = "次へ";
  } else if (wz.step === 1){
    body.innerHTML = `<div class="wz-step-label">STEP 2 / ${WZ_STEPS.length}</div>
      <h2 class="wz-question">従業員数はどのくらいですか？</h2>
      <div class="wz-options single" id="wzEmpOpts">
        ${[["","指定しない"],["20","20名以下"],["100","21〜100名"],["300","101〜300名"],["900","301〜900名"],["901","901名以上"]]
          .map(([v,l]) => `<button class="wz-opt" data-v="${v}" aria-pressed="${wz.emp===v}">${l}</button>`).join("")}
      </div>`;
    body.querySelectorAll("#wzEmpOpts .wz-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        wz.emp = btn.dataset.v;
        body.querySelectorAll("#wzEmpOpts .wz-opt").forEach(b => b.setAttribute("aria-pressed", b===btn));
        updateLiveCount();
      });
    });
    nextBtn.textContent = "次へ";
  } else if (wz.step === 2){
    body.innerHTML = `<div class="wz-step-label">STEP 3 / ${WZ_STEPS.length}</div>
      <h2 class="wz-question">どんな目的の補助金をお探しですか？（複数選択可）</h2>
      <div class="wz-tags" id="wzTagOpts">
        ${PURPOSE_TAGS.map(t => `<button class="wz-tag" data-v="${t}" aria-pressed="${wz.tags.includes(t)}">${t}</button>`).join("")}
      </div>
      <div class="wz-free-text field">
        <label for="wzFreeText">その他キーワードで探す（任意）</label>
        <input type="text" id="wzFreeText" placeholder="例: 農業、店舗改装" value="${wz.freeText||''}"/>
      </div>`;
    body.querySelectorAll("#wzTagOpts .wz-tag").forEach(btn => {
      btn.addEventListener("click", () => {
        const v = btn.dataset.v;
        const idx = wz.tags.indexOf(v);
        if (idx === -1) wz.tags.push(v); else wz.tags.splice(idx,1);
        btn.setAttribute("aria-pressed", wz.tags.includes(v));
        updateLiveCount();
      });
    });
    document.getElementById("wzFreeText").addEventListener("input", e => {
      wz.freeText = e.target.value.trim();
      const base = wz.tags.slice();
      if (wz.freeText) base.push(wz.freeText);
      wz._composedTags = base;
      updateLiveCount();
    });
    nextBtn.textContent = "次へ";
  } else if (wz.step === 3){
    body.innerHTML = `<div class="wz-step-label">STEP 4 / ${WZ_STEPS.length}</div>
      <h2 class="wz-question">希望する補助上限額の目安は？</h2>
      <div class="wz-options single" id="wzAmtOpts">
        ${[["","指定しない"],["0-1000000","100万円未満"],["1000000-5000000","100〜500万円"],["5000000-10000000","500〜1000万円"],["10000000-999999999999","1000万円以上"]]
          .map(([v,l]) => `<button class="wz-opt" data-v="${v}" aria-pressed="${wz.amt===v}">${l}</button>`).join("")}
      </div>`;
    body.querySelectorAll("#wzAmtOpts .wz-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        wz.amt = btn.dataset.v;
        body.querySelectorAll("#wzAmtOpts .wz-opt").forEach(b => b.setAttribute("aria-pressed", b===btn));
        updateLiveCount();
      });
    });
    nextBtn.textContent = "結果を見る";
  } else if (wz.step === 4){
    const tags = (wz._composedTags && wz._composedTags.length) ? wz._composedTags : wz.tags;
    state.q = tags.join(" ");
    state.pref = wz.pref; state.emp = wz.emp; state.amt = wz.amt; state.openOnly = true; state.sort = "deadline";
    visibleCount = 30;
    document.getElementById("fKeyword").value = state.q;
    document.getElementById("fPref").value = state.pref;
    document.getElementById("fEmp").value = state.emp;
    document.getElementById("fAmt").value = state.amt;
    document.getElementById("fOpenOnly").checked = true;
    document.getElementById("sortSelect").value = "deadline";
    renderResults();
    document.getElementById("tabSearchBtn").click();
    return;
  }
  updateLiveCount();
}

function updateLiveCount(){
  document.getElementById("wzLiveCount").innerHTML = wzLiveCountText();
}

function initWizardNav(){
  document.getElementById("wzNext").addEventListener("click", () => { wz.step = Math.min(wz.step+1, WZ_STEPS.length-1); renderWizardStep(); });
  document.getElementById("wzBack").addEventListener("click", () => { wz.step = Math.max(wz.step-1, 0); renderWizardStep(); });
}

/* ---------------- boot ---------------- */
function boot(){
  document.getElementById("statTotal").textContent = DATA.length.toLocaleString();
  const openCount = DATA.filter(r => subsidyStatus(r) !== "closed").length;
  document.getElementById("statOpen").textContent = openCount.toLocaleString();
  document.getElementById("footUpdated").textContent = "最終更新: " + TODAY.getFullYear() + "年" + (TODAY.getMonth()+1) + "月" + TODAY.getDate() + "日（jGrants公開APIより取得）";
  initFilterPanel();
  initTabs();
  initWizardNav();
  renderResults();
}
boot();
</script>
